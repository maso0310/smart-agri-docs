# 智慧農業課程技術文件中心 - Nginx 反向代理設定
# =============================================
#
# 此應用掛載在 /smart-agri-docs 路徑

server {
    listen 80;
    server_name localhost;  # 改為你的網域名稱

    # 安全標頭
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip 壓縮
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;

    # 根路徑重導向到 /smart-agri-docs/
    location = / {
        return 302 /smart-agri-docs/;
    }

    # 智慧農業文件中心 - 靜態檔案快取
    location ~* ^/smart-agri-docs/.*\.(html|css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        proxy_pass http://web:5000;
        proxy_cache_valid 200 1d;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # 智慧農業文件中心 - 主要路由
    location /smart-agri-docs {
        proxy_pass http://web:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超時設定
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 其他路徑（可添加其他服務）
    location / {
        proxy_pass http://web:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 錯誤頁面
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

