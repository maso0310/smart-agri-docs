# 智慧農業課程技術文件中心 - Docker Compose 設定
# ==============================================
#
# 使用方式：
#   啟動服務：docker-compose up -d
#   停止服務：docker-compose down
#   查看日誌：docker-compose logs -f
#   重新建置：docker-compose up -d --build

version: '3.8'

services:
  web:
    build: .
    container_name: smart-agri-docs
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-smart-agri-docs-production}
      - FLASK_ENV=production
    volumes:
      # 如需即時更新文件，可取消註解以下行
      # - ./static:/app/static:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 可選：使用 Nginx 作為反向代理
  nginx:
    image: nginx:alpine
    container_name: smart-agri-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # SSL 證書（如有需要）
      # - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
    profiles:
      - with-nginx
